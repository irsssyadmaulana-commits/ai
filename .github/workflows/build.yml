name: Build NotMe AI APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Buat keystore
        run: keytool -genkeypair -keystore notme.jks -alias notme -keyalg RSA -keysize 2048 -validity 10000 -storepass bubbleai123 -keypass bubbleai123 -dname "CN=NotMeAI"
      - name: Build APK
        run: gradle assembleRelease
      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk NotMeAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NotMeAI-apk
          path: NotMeAI.apk
